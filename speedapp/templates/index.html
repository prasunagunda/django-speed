<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Speed Test</title>
<style>
body{background:#071227;color:#fff;font-family:Arial;text-align:center;padding:20px}
.card{max-width:800px;margin:auto;background:#08142a;padding:20px;border-radius:12px}
button{padding:12px 20px;margin-top:20px;background:#00e0ff;border:none;border-radius:8px;font-weight:bold}
</style>
</head>
<body>

<div class="card">
<h1>📶 Client Speed Test</h1>
<div>Network: <b id="net">Loading...</b></div>

<h2 id="speed">0 Mbps</h2>

<div>
Download: <span id="download">—</span><br>
Upload: <span id="upload">—</span><br>
Ping: <span id="ping">—</span>
</div>

<button onclick="startTest()">Run Speed Test</button>
<div id="msg"></div>
</div>

<script>
async function loadNetwork(){
  try{
    const r = await fetch('/network/');
    const d = await r.json();
    document.getElementById('net').innerText =
      d.isp + (d.city ? " • "+d.city : "");
  }catch{
    document.getElementById('net').innerText="Unknown";
  }
}

async function pingTest(){
  const t0 = performance.now();
  await fetch('/ping/');
  return Math.round(performance.now()-t0);
}

async function downloadTest(){
  const start = performance.now();
  const resp = await fetch('/testfile/?kb=8192');
  const blob = await resp.blob();
  const end = performance.now();
  const mbps = (blob.size*8)/((end-start)/1000)/1e6;
  return mbps;
}

async function uploadTest(){
  const data = new Blob([new Uint8Array(4*1024*1024)]);
  const start = performance.now();
  await fetch('/upload-test/',{method:'POST',body:data});
  const end = performance.now();
  return (data.size*8)/((end-start)/1000)/1e6;
}

async function startTest(){
  document.getElementById('msg').innerText="Running...";
  loadNetwork();

  const ping = await pingTest();
  const dl = await downloadTest();
  const ul = await uploadTest();

  document.getElementById('download').innerText=dl.toFixed(2)+" Mbps";
  document.getElementById('upload').innerText=ul.toFixed(2)+" Mbps";
  document.getElementById('ping').innerText=ping+" ms";
  document.getElementById('speed').innerText=dl.toFixed(1)+" Mbps";
  document.getElementById('msg').innerText="Completed";
}

loadNetwork();
</script>

</body>
</html>
