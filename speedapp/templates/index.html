<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Combined Speed Test</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#071227;color:#eaf3ff;text-align:center;padding:28px}
    .card{max-width:860px;margin:0 auto;background:linear-gradient(180deg,#08142a,#071227);padding:24px;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,0.6)}
    h1{margin:0 0 6px;font-size:26px}
    .sub{color:#9fb0c6;margin-bottom:12px}
    .netbox{background:#0f253c;padding:10px;border-radius:10px;margin:10px 0;font-weight:700}
    .row{display:flex;justify-content:space-between;margin-top:18px}
    .col{flex:1}
    .stat{font-size:16px}
    button{margin-top:20px;padding:12px 20px;border-radius:10px;border:none;background:linear-gradient(90deg,#00e0ff,#3ec4ff);font-size:16px;font-weight:800;cursor:pointer}
    button:disabled{opacity:0.6;cursor:default}
    #message{margin-top:10px;color:#9fb0c6}
  </style>
</head>
<body>
  <div class="card">
    <h1>📶 Combined Speed Test</h1>
    <div class="sub">Client-side (your browser) + Server-side (this host)</div>

    <div class="netbox">Network: <span id="net">Loading...</span></div>

    <div class="row">
      <div class="col stat">
        <h3>Client</h3>
        <small>Download</small><div id="client-download">—</div>
        <small>Upload</small><div id="client-upload">—</div>
        <small>Ping</small><div id="client-ping">—</div>
      </div>

      <div class="col stat">
        <h3>Server</h3>
        <small>Download</small><div id="server-download">—</div>
        <small>Upload</small><div id="server-upload">—</div>
        <small>Ping</small><div id="server-ping">—</div>
      </div>
    </div>

    <button id="btn" onclick="runAll()">🚀 Run Combined Test</button>
    <div id="message"></div>
  </div>

<script>
  async function loadNetwork(){
    try{
      const r = await fetch('/network/?t=' + Date.now());
      const d = await r.json();
      let label = (d.isp || 'Unknown');
      if (d.city) label += ' • ' + d.city;
      document.getElementById('net').innerText = label;
    }catch(e){
      document.getElementById('net').innerText = 'Unknown';
    }
  }

  async function pingTest(runs=4){
    const times = [];
    for(let i=0;i<runs;i++){
      const start = performance.now();
      try {
        await fetch('/ping/?t=' + Date.now(), {cache: "no-store"});
        times.push(performance.now() - start);
      } catch {
        times.push(999);
      }
      await new Promise(res => setTimeout(res, 120));
    }
    times.sort((a,b)=>a-b);
    const mid = Math.floor(times.length/2);
    return Math.round(times.length % 2 ? times[mid] : (times[mid-1]+times[mid])/2);
  }

  async function downloadTest(kb=8192){
    const url = `/testfile/?kb=${kb}&cache=${Date.now()}`;
    const start = performance.now();
    const resp = await fetch(url, {cache: "no-store"});
    if (!resp.body) throw new Error("streaming not supported");
    const reader = resp.body.getReader();
    let received = 0;
    while(true){
      const {done, value} = await reader.read();
      if (done) break;
      received += value.byteLength;
    }
    const end = performance.now();
    const duration = Math.max((end-start)/1000, 0.0001);
    const mbps = (received * 8) / duration / 1_000_000;
    return mbps;
  }

  async function uploadTest(mb=4){
    const size = Math.max(1, Math.min(mb, 20)) * 1024 * 1024;
    const chunk = new Uint8Array(1024 * 1024); // 1 MB chunk
    const parts = Math.ceil(size / chunk.byteLength);
    const blobs = new Array(parts).fill(chunk);
    const body = new Blob(blobs);
    const start = performance.now();
    await fetch('/upload-test/?t=' + Date.now(), { method: 'POST', body });
    const end = performance.now();
    const duration = Math.max((end-start)/1000, 0.0001);
    return (size * 8) / duration / 1_000_000;
  }

  async function serverSpeed(){
    const r = await fetch('/server-speed/');
    return r.json();
  }

  async function runAll(){
    const btn = document.getElementById('btn');
    const msg = document.getElementById('message');
    btn.disabled = true;
    msg.innerText = 'Running client tests... (this may take 10-40s)';
    try{
      await loadNetwork();

      // client download: 3 runs median
      const dlRuns = [4096, 8192, 12288]; // KB
      const dlResults = [];
      for(let i=0;i<dlRuns.length;i++){
        const r = await downloadTest(dlRuns[i]);
        dlResults.push(r);
      }
      dlResults.sort((a,b)=>a-b);
      const clientDownload = dlResults[Math.floor(dlResults.length/2)];

      const clientUpload = await uploadTest(4);
      const clientPing = await pingTest(4);

      document.getElementById('client-download').innerText = clientDownload.toFixed(2) + ' Mbps';
      document.getElementById('client-upload').innerText = clientUpload.toFixed(2) + ' Mbps';
      document.getElementById('client-ping').innerText = clientPing + ' ms';

      // server-side
      msg.innerText = 'Running server-side test (may take 20–60s)...';
      const server = await serverSpeed();
      if (server.status === 'success' || server.download_mbps !== undefined) {
        document.getElementById('server-download').innerText = (server.download_mbps || server.download).toString() + ' Mbps';
        document.getElementById('server-upload').innerText = (server.upload_mbps || server.upload).toString() + ' Mbps';
        document.getElementById('server-ping').innerText = (server.ping_ms || server.ping).toString() + ' ms';
      } else {
        document.getElementById('server-download').innerText = server.error || 'Error';
        document.getElementById('server-upload').innerText = server.error || 'Error';
        document.getElementById('server-ping').innerText = server.error || 'Error';
      }

      msg.innerText = 'Completed';
    }catch(err){
      console.error(err);
      msg.innerText = 'Error: ' + (err.message || err);
    } finally {
      btn.disabled = false;
    }
  }

  loadNetwork();
  setInterval(loadNetwork, 30000);
</script>
</body>
</html>
