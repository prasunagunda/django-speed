<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Combined Speed Test</title>

<style>
body{background:#071227;color:#fff;font-family:Arial;text-align:center;padding:25px}
.card{max-width:850px;margin:auto;background:#08142a;padding:25px;border-radius:14px}
.netbox{background:#0f253c;padding:10px;border-radius:10px;margin:10px}
.row{display:flex;justify-content:space-between}
.col{flex:1}
button{padding:12px 20px;background:#00e0ff;border:none;border-radius:10px;font-weight:bold}
</style>

</head>
<body>

<div class="card">

<h1>📶 Combined Speed Test</h1>
<div class="netbox">Network: <span id="net">Loading...</span></div>

<div class="row">
<div class="col">
<h3>Client</h3>
Download <div id="client-download">—</div>
Upload <div id="client-upload">—</div>
Ping <div id="client-ping">—</div>
</div>

<div class="col">
<h3>Server</h3>
Download <div id="server-download">—</div>
Upload <div id="server-upload">—</div>
Ping <div id="server-ping">—</div>
</div>
</div>

<button onclick="runAll()">Run Test</button>
<div id="message"></div>

</div>

<script>


/* -------- REAL ISP NAME (CLIENT SIDE) -------- */
async function loadNetwork(){
  try{
    const r = await fetch("https://ipinfo.io/json");
    const d = await r.json();

    let isp = d.org || "Unknown ISP";
    isp = isp.replace(/^AS\d+\s*/, "");
    document.getElementById("net").innerText = isp;

  }catch{
    document.getElementById("net").innerText = "Unknown";
  }
}


/* -------- Ping -------- */
async function pingTest(){
  const start = performance.now();
  await fetch('/ping/');
  return Math.round(performance.now() - start);
}


/* -------- Download -------- */
async function downloadTest(){
  const start = performance.now();
  const resp = await fetch('/testfile/?kb=8192');
  const reader = resp.body.getReader();

  let bytes = 0;
  while(true){
    const {done,value} = await reader.read();
    if(done) break;
    bytes += value.length;
  }

  const duration = (performance.now()-start)/1000;
  return ((bytes*8)/duration/1_000_000).toFixed(2);
}


/* -------- Upload -------- */
async function uploadTest(){
  const data = new Blob([new Uint8Array(4*1024*1024)]);
  const start = performance.now();

  await fetch('/upload-test/', {method:'POST', body:data});

  const duration = (performance.now()-start)/1000;
  return ((data.size*8)/duration/1_000_000).toFixed(2);
}


/* -------- Server Speed -------- */
async function serverSpeed(){
  const r = await fetch('/server-speed/');
  return r.json();
}


/* -------- Run All Tests -------- */
async function runAll(){

document.getElementById("message").innerText="Running...";

await loadNetwork();

const dl = await downloadTest();
const ul = await uploadTest();
const pg = await pingTest();

document.getElementById("client-download").innerText = dl+" Mbps";
document.getElementById("client-upload").innerText = ul+" Mbps";
document.getElementById("client-ping").innerText = pg+" ms";

const server = await serverSpeed();

document.getElementById("server-download").innerText = server.download+" Mbps";
document.getElementById("server-upload").innerText = server.upload+" Mbps";
document.getElementById("server-ping").innerText = server.ping+" ms";

document.getElementById("message").innerText="Completed";

}


loadNetwork();

</script>
</body>
</html>
